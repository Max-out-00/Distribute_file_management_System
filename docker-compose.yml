x-app: &app
  image: distributed-fs:local
  build: .

services:
  metadata:
    <<: *app
    command: ["python", "-m", "metadata_server.server", "--bind-host", "0.0.0.0", "--port", "5000", "--db", "/data/metadata.db"]
    environment:
      BIND_HOST: 0.0.0.0
      METADATA_HOST: metadata
      METADATA_PORT: "5000"
      METADATA_DB: /data/metadata.db
    ports:
      - "5000:5000"
    volumes:
      - metadata-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "metadata", "--port", "5000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  node1:
    <<: *app
    command: ["python", "-m", "data_node.init", "--node-id", "node1", "--bind-host", "0.0.0.0", "--advertise-host", "node1", "--port", "5001", "--meta-host", "metadata", "--meta-port", "5000", "--storage-dir", "/data"]
    environment:
      BIND_HOST: 0.0.0.0
      METADATA_HOST: metadata
      METADATA_PORT: "5000"
    volumes:
      - node1-data:/data
    depends_on:
      metadata:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "node", "--port", "5001"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  node2:
    <<: *app
    command: ["python", "-m", "data_node.init", "--node-id", "node2", "--bind-host", "0.0.0.0", "--advertise-host", "node2", "--port", "5002", "--meta-host", "metadata", "--meta-port", "5000", "--storage-dir", "/data"]
    environment:
      BIND_HOST: 0.0.0.0
      METADATA_HOST: metadata
      METADATA_PORT: "5000"
    volumes:
      - node2-data:/data
    depends_on:
      metadata:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "node", "--port", "5002"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  node3:
    <<: *app
    command: ["python", "-m", "data_node.init", "--node-id", "node3", "--bind-host", "0.0.0.0", "--advertise-host", "node3", "--port", "5003", "--meta-host", "metadata", "--meta-port", "5000", "--storage-dir", "/data"]
    environment:
      BIND_HOST: 0.0.0.0
      METADATA_HOST: metadata
      METADATA_PORT: "5000"
    volumes:
      - node3-data:/data
    depends_on:
      metadata:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "node", "--port", "5003"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  client:
    <<: *app
    profiles: ["client"]
    working_dir: /work
    volumes:
      - .:/work
    environment:
      PYTHONPATH: /work
      METADATA_HOST: metadata
      METADATA_PORT: "5000"
    command: ["python", "-c", "import time; time.sleep(3600)"]
    depends_on:
      metadata:
        condition: service_healthy
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "metadata", "--host", "metadata", "--port", "5000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  metadata-data:
  node1-data:
  node2-data:
  node3-data:
